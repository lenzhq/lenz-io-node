name: Smoke

# Runs test/smoke.test.ts against the live API with a real key. The release
# workflow calls this and publishes only when it passes. A missing key is a
# failure, never a skip: a smoke run that checked nothing must not let a
# release through.
#
# Also runs by hand (Actions > Smoke > Run workflow) and on a pull request
# that changes the smoke test or these workflows.

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - test/smoke.test.ts
      - .github/workflows/smoke.yml
      - .github/workflows/release.yml

permissions:
  contents: read

jobs:
  smoke:
    name: live API smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Require the smoke key
        env:
          LENZ_E2E_KEY: ${{ secrets.LENZ_E2E_KEY }}
        run: |
          if [ -z "$LENZ_E2E_KEY" ]; then
            echo "::error::LENZ_E2E_KEY is not set; the smoke run would check nothing."
            exit 1
          fi
      - name: Run smoke tests against the live API
        env:
          LENZ_E2E_KEY: ${{ secrets.LENZ_E2E_KEY }}
          LENZ_BASE_URL: ${{ vars.LENZ_BASE_URL }}
        run: npm run test:smoke
